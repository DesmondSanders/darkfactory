<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: #ffffff;
        color: #111111;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 5rem);
        line-height: 1.1;
        text-align: center;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #111111;
          color: #f5f5f5;
        }
      }
    </style>
  </head>
  <body>
    <h1>Hello World</h1>
  </body>
</html>
