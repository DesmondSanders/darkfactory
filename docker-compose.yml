version: '3.9'
services:
  db:
    image: postgres:16
    container_name: expensepulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expensepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expensepulse}
      POSTGRES_DB: ${POSTGRES_DB:-expensepulse}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: expensepulse-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://expensepulse:expensepulse@db:5432/expensepulse?schema=public}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
      PORT: ${PORT:-4000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "4000:4000"

volumes:
  pgdata:
